name: Run Program

on:
  push:
    branches: [main, helios-cuda]
  pull_request:
    branches:
      - "**"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_program:
    name: Test SP1 Helios Program
    runs-on: ubuntu-latest
    environment: test_program
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SOURCE_CONSENSUS_RPC_URL: ${{ secrets.SOURCE_CONSENSUS_RPC_URL }}
      # From Gloas the test fetches the finalized execution block header from this node.
      SOURCE_EXECUTION_RPC_URL: ${{ secrets.SOURCE_EXECUTION_RPC_URL }}
      SOURCE_CHAIN_ID: ${{ vars.SOURCE_CHAIN_ID }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: minimal
          toolchain: stable
      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up 
          ~/.sp1/bin/cargo-prove prove --version
          source ~/.bashrc
      - name: Run test
        run: |
          cd script
          cargo run --bin test --release
       
