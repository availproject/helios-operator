[workspace]
members = ["primitives", "script"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["0xSasaPrsic"]

[workspace.dependencies]
# sp1-helios
sp1-helios-primitives = { path = "primitives" }

# helios
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
helios-ethereum = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
# alloy 2.x consensus types (already pulled in by helios 0.12): its Header knows the Glamsterdam
# fields, so a Gloas-era execution header re-encodes to its block hash.
alloy-consensus-v2 = { package = "alloy-consensus", version = "2.1.1", default-features = false, features = ["serde"] }
alloy-rlp = { version = "0.3.12", default-features = false }

# general
dotenv = "0.15.0"
sp1-sdk = { version = "6.3.1", default-features = false, features = ["network"] }
sp1-build = "6.3.1"
tokio = "1.38.0"
serde = "1.0.203"
url = { version = "2.5.2", features = ["serde"] }

serde_cbor = "0.11.2"
hex = "0.4.3"
serde_json = "1.0.125"
alloy-sol-types = "1.3.1"
clap = "4.5.9"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3" }

alloy-primitives = { version = "1.3.1", features = ["serde"] }
alloy = { version = "1.0.27", features = ["full"] }
anyhow = "1.0.86"

reqwest = "0.12.5"
tree_hash = "0.10.0"
cargo_metadata = "0.18"

avail-rust-client = "0.5.1"
jsonrpsee = { version = "0.26.0", features = ["http-client", "macros", "async-client"] }

[patch.crates-io]
# NOTE: The SP1 precompile patches (sha2/sha3/tiny-keccak/bls12_381) only matter for the
# zkVM *guest* program (built in the helios-sp1 program repo), where they accelerate crypto
# inside the proof. The operator is a host binary that only builds inputs and calls sp1-sdk,
# so it does not need them. For SP1 v6 they are actively harmful here: the v6 bls12_381 patch
# requires sha2 0.10 while helios uses sha2 0.9, which fails to compile. Use helios' stock
# crypto stack on the host instead.
# From upstream: https://github.com/a16z/helios/blob/master/Cargo.toml#L115
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }

[profile.release]
panic = "abort"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
